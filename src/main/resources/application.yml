spring:
  application:
    name: baton

  # OpenAI 호출 타임아웃은 여기가 아니라 AiConfig의 OpenAiHttpClientBuilderCustomizer 빈에서
  # 건다 — Spring AI의 OpenAI 연동이 spring.http.client.* 를 타지 않는 별도 OkHttp 클라이언트를
  # 쓰기 때문에, 이 표준 프로퍼티로는 실제로 타임아웃이 안 걸리는 게 라이브에서 확인됐다.

  # Java 21 가상 스레드 — 동시 요청 처리량 향상.
  # 혹시 이상 동작하면 false로 되돌리면 됨.
  threads:
    virtual:
      enabled: true

  # 파일 업로드 한도 (RAG 문서 업로드용). 기본값 1MB라 금방 막힘.
  # 프론트 안내(50MB) 기준으로 통일.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/baton
    username: baton
    password: ${DB_PASSWORD:1234}

  # ── 세션(로그인 유지) ──────────────────────────────────
  # 세션 저장소(JDBC)와 만료(7일)는 SessionConfig의 @EnableJdbcHttpSession에서 관리한다.
  # (Boot 4는 세션 스토어 자동설정이 없어 store-type/timeout 프로퍼티가 무시되기 때문)
  # always = SPRING_SESSION 테이블이 없으면 시작 시 생성(개발 편의). SessionConfig가 이 값을 읽는다.
  session:
    jdbc:
      initialize-schema: always

  jpa:
    hibernate:
      ddl-auto: update       # 개발 중에만. 운영은 validate 또는 none
    show-sql: true
    open-in-view: false      # 커넥션 오래 잡는 것 방지 (권장)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small   # 1536차원
      chat:
        options:
          model: gpt-5.4-nano             # 채팅 Q&A·브리핑용(빠르고 저렴). 인수인계 자료 생성은 app.ai.analysis-model 사용
          temperature: 0.3                # 근거 기반 답변이라 낮게
    vectorstore:
      pgvector:
        initialize-schema: true           # vector_store 테이블 자동 생성 (개발용)
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536                  # 임베딩 모델 차원과 반드시 일치

springdoc:
  swagger-ui:
    path: /swagger-ui.html      # http://localhost:8080/swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    # Swagger UI가 XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 자동 첨부 → CSRF 켜진 채로 POST 테스트 가능
    csrf:
      enabled: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

# 헬스체크. /actuator/health는 인증 없이 열려있으니(SecurityConfig) 세부 정보는 절대 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    diskspace:
      threshold: 300MB   # 이거보다 여유공간이 적으면 DOWN — 배포 실패로 이어지기 전에 미리 잡기 위함

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: BATON_SESSION
        http-only: true        # JS에서 접근 불가 → XSS로 세션 탈취 방지
        same-site: lax         # 교차 사이트 요청엔 쿠키 미전송 → CSRF 기본 방어
        # secure: true 는 HTTPS 전용이라 운영 프로파일(application-prod.yml)에서만 켠다

logging:
  level:
    com.baton: debug
    org.hibernate.orm.jdbc.bind: trace   # SQL에 들어간 실제 파라미터 값까지 로그로

# 프론트 주소(CORS 허용 origin). 콤마 구분. allowedOriginPatterns라 와일드카드(*) 사용 가능.
# 운영에선 환경변수 APP_CORS_ALLOWEDORIGINS 로 덮어쓸 수 있다.
app:
  ai:
    # 인수인계 자료 생성(초안·질문·재생성) 전용 모델(품질용). 채팅·브리핑은 위 spring.ai.openai.chat 모델(gpt-5.4-nano) 사용.
    analysis-model: gpt-5.4
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,https://baton-fe.vercel.app,https://baton-fe-*.vercel.app,https://d1rk2gzucjdf8h.cloudfront.net
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
  discord:
    # 에러(ERROR) 로그를 디스코드 채널로 보낼 웹훅 URL. 비어있으면 전송 안 함(로컬 개발 기본값).
    error-webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}
  upload:
    # 파일 1개당 50MB 제한(spring.servlet.multipart.max-file-size)과는 별개로,
    # 누적 개수·용량이 무제한으로 쌓이는 걸 막기 위함(S3 비용·임베딩 비용 남용 방지).
    max-files-per-handover: 30
    max-total-size-per-handover-mb: 300
    max-total-size-per-account-mb: 1024   # 계정(인계자) 전체 기준. 파일 삭제하면 다시 풀림.
  masking:
    # 민감정보 마스킹 검수 단계(#45). 켜면 업로드 후 임베딩 전에 MASKING_REVIEW에서 멈추고 사용자 확정을 기다린다.
    # 프론트 검수 화면이 준비되기 전까지 운영은 꺼둔다. 로컬에서 켜려면 환경변수 MASKING_ENABLED=true.
    enabled: ${MASKING_ENABLED:false}
