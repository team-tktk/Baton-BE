# 운영 프로파일. 실행: --spring.profiles.active=prod
# Swagger는 API 구조를 통째로 노출하므로 운영에서는 반드시 끈다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  jpa:
    hibernate:
      ddl-auto: validate   # 운영에서 스키마 자동변경 금지
    show-sql: false

  # 운영에선 세션 스키마를 자동 생성하지 않는다(마이그레이션으로 관리). 최초 배포 전 SPRING_SESSION 테이블 생성 필요.
  session:
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        secure: true   # HTTPS 연결에서만 쿠키 전송

# 운영 로그 — 개발용 상세 로그를 끈다.
# application.yml은 SQL과 그 바인딩 파라미터 값(bind: trace)까지 찍는데, 이러면 회원가입 SQL에
# 이메일·비밀번호 해시 같은 민감정보가 로그에 그대로 남는다. 운영에선 반드시 꺼야 한다.
logging:
  level:
    com.baton: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

