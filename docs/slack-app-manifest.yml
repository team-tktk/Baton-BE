display_information:
  name: BATON
oauth_config:
  redirect_urls:
    - http://127.0.0.1:8081/api/v1/integrations/slack/oauth/callback
  scopes:
    user:
      - channels:read
      - channels:history
      - groups:read
      - groups:history
settings:
  event_subscriptions:
    request_url: https://YOUR_PUBLIC_DOMAIN/api/v1/integrations/slack/events
    user_events:
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
